[mgr]
# empty so the terminal handles mouse events (click-drag text selection, scroll)
# instead of yazi capturing them for its own UI
# mouse_events = []

[preview]
# Windows Terminal doesn't report pixel dimensions to yazi, so it falls back
# to 0x0 and skips rendering unless we set explicit fallback sizes here.
max_width = 1200
max_height = 1200

[opener]
# use windows default opener
# note: %* was the pre-Yazi-26 placeholder for "all selected files" and
# silently stopped working after upgrading to Yazi 26 -- %s is the current one
win-open = [
    { run = 'start "" %s', desc = "System Default", for = "windows" }
]
# Define Neovim as an opener
nvim = [
    { run = 'nvim %s', block = true, desc = "Neovim", for = "windows" },
    { run = 'nvim %s', block = true, desc = "Neovim", for = "unix" }
]

[open]
rules = [
    # 1. Specific rules first (Text & Markdown)
    { mime = "text/*", use = ["nvim", "win-open", "reveal"] },
    { mime = "*/txt", use = ["nvim", "win-open", "reveal"] },
    { mime = "*/markdown", use = ["nvim", "win-open", "reveal"] },
    
    # 2. Generic catch-all last (Matches everything else)
    { mime = "*", use = ["win-open"] }
# enhancement: Use the open-with-cmd yazi Community Plugin to type out custom opener command
]
