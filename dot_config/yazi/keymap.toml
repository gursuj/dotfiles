# note: use ~ to see list of keymaps 
# https://yazi-rs.github.io/docs/configuration/keymap
# prepend has higher priority than default binds, whereas append has lower
[[mgr.prepend_keymap]]
on   = "o"
run  = "plugin open-with-cmd-fixed block" # blocking as in non-async
desc = "Open with command in the terminal"

[[mgr.prepend_keymap]]
on   = "O"
run  = "plugin open-with-cmd-fixed"
desc = "Open with command"

[[mgr.prepend_keymap]]
on   = "l"
run  = "plugin smart-enter"
desc = "Enter the child directory, or open the file"

[[mgr.prepend_keymap]]
on   = "<Right>"
run  = "plugin smart-enter"
desc = "Enter the child directory, or open the file"

[[mgr.prepend_keymap]]
on = [ "g", "r" ]
run = 'shell -- ya emit cd "$(git rev-parse --show-toplevel)"'
desc = "Goto git repo root"

# override default bind for reverse search to help instead
[[mgr.prepend_keymap]]
on = "?"
run = "help"
desc = "Open help"
