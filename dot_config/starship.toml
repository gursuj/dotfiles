# Minimal prompt: path (cwd + its parent) + git branch + git status.
# No Nerd Font glyphs used anywhere below — avoids tofu/missing-icon boxes
# on Windows Terminal profiles without a Nerd Font installed.
format = """$directory$git_branch$git_status$character"""

[directory]
truncation_length = 2
# Off so repo roots still show their parent, not just the repo name.
truncate_to_repo = false
style = "bold cyan"

[git_branch]
symbol = ""
format = "[$symbol$branch]($style) "
style = "bold purple"

# All the pieces below only show up if that condition is true (e.g. no
# "?1" shown unless there's actually 1 untracked file).
[git_status]
format = '([$all_status$ahead_behind]($style)) '
style = "bold red"
staged = "A${count}"
modified = "M${count}"
untracked = "??${count}"
deleted = "D${count}"
renamed = "R${count}"
stashed = "S${count}"
conflicted = "U${count}"
ahead = ">${count}"
behind = "<${count}"
diverged = "<>"

[character]
success_symbol = "[>](bold green)"
error_symbol = "[>](bold red)"
