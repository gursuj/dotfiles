add_newline = true
command_timeout = 200
format = "$username$hostname$custom[$directory$git_branch$git_status]($style)$character"

# ---------------------------------------------------------------------------
# Local additions: user@host only when the session is remote (ssh or mosh).
# ---------------------------------------------------------------------------
[username]
show_always = false
detect_env_vars = ["SSH_CONNECTION", "SSH_TTY", "MOSH_CONNECTION"]
style_user = "bold cyan"
style_root = "bold red"
format = "[$user]($style)@"

[hostname]
# ssh_only keys off SSH_CONNECTION, which mosh-server typically inherits too.
ssh_only = true
format = "[$hostname]($style) "
style = "bold cyan"
trim_at = "."

# mosh sets only MOSH_CONNECTION when SSH_CONNECTION is absent (e.g. mosh from a
# local tmux), so cover that case explicitly. Costs nothing locally: `when` gates it.
[custom.mosh_host]
when = '''test -n "$MOSH_CONNECTION" && test -z "$SSH_CONNECTION"'''
command = "hostname"
format = "[$output]($style) "
style = "bold cyan"

[character]
error_symbol = "[✗](bold cyan)"
success_symbol = "[❯](bold cyan)"

[directory]
truncation_length = 2
truncation_symbol = "…/"
repo_root_style = "bold cyan"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$branch]($style) "
style = "italic cyan"

[git_status]
format     = '[$all_status]($style)'
style      = "cyan"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked  = "? "
modified   = " "
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""
