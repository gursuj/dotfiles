# #######################################################################################
# AUTOGENERATED HYPRLAND CONFIG.
# PLEASE USE THE CONFIG PROVIDED IN THE GIT REPO /examples/hyprland.conf AND EDIT IT,
# OR EDIT THIS ONE ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################

autogenerated = 0 # remove this line to remove the warning

# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hyprland.org/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf


################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/

# single monitor(laptop)
# monitor = eDP-1, 1366x768@60, 0x0, 1

# dual monitor home setup
monitor = HDMI-A-1, preferred, 0x0, 1
monitor = eDP-1, 1366x768@60, 1366x0, 1

# screen mirroring setup
# monitor = eDP-1, preferred, 0x0, 1
# monitor = HDMI-A-1, preferred, auto, 1, mirror, eDP-1
# monitor = HDMI-A-1, 1920x1080@60, auto, 1, mirror, eDP-1

# projector setup (w/ laptop display as main and projector as secondary)
# monitor = eDP-1, preferred, 0x0, 1
# monitor = HDMI-A-1, preferred, auto, 1

# disable laptop monitor
# monitor = eDP-1, disable

###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = ghostty
$browser = firefox
$fileManager = nautilus
# make uwsm run apps launched through wofi as separate units
# otherwise, issue may arise when running apps in same systemd unit as compositor
# NOTE: the --define part is necessary
$menu = uwsm app -- $(wofi --show drun --allow-images --define=drun-print_desktop_file=true)
# $menu = uwsm app -- "$(wofi --show drun --allow-images --define=drun-print_desktop_file=true | sed -E "s/(\.desktop) /\1:/")"
$borderSize = 1
$rounding = 0

#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
# exec-once = waybar & hyprpaper & firefox


#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 0
    gaps_out = 0
    gaps_workspaces = 50

    border_size = $borderSize

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(33ccffee) 
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = master

    snap {
        # enabled = true
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = $rounding

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0
    dim_inactive = false
    dim_strength = 0.15

    shadow {
        enabled = false
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = false
        size = 1
        passes = 1

        vibrancy = 0.16
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 0
    animation = workspacesOut, 0
    # animation = workspacesIn, 1, 1.21, almostLinear, slide
    # animation = workspacesOut, 1, 1.94, almostLinear, slide
}

cursor {
    no_warps = true
    no_hardware_cursors = 1
}

# Ref https://wiki.hyprland.org/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.

windowrule = border_color rgb(999999), match:fullscreen 1 

# center window if there is only 1 window in a tiling workspace
# maybe this should be named rule if you want effects to be reverted when condition no longer met? 
# workspace = w[tv1], gapsout:0 130

# no outer gaps for ws1 (everdo)
# workspace = 1, gapsout:0
# remove gaps in fullscreen (useful when passing 1 to fullscreen)
# currently has bug where rounding isn't reset upon toggling fullscreen for floating windows
# workspace = f[1], gapsout:0, gapsin:0, rounding:0

# make windows in scratchpad (special) float by default
windowrule {
	name = special-workspace
		match:workspace = s[1]
		float = on
		size = monitor_w*0.8 monitor_h*0.8 
		center = on
}

# obsidian settings window floats at scratchpad size
windowrule {
	name = obsidian-settings
	match {
		class = obsidian
		title = ^Settings
	}
	float = on
	size = monitor_w*0.8 monitor_h*0.8
	center = on
}

workspace = special:magic, on-created-empty:$terminal
# workspace = 2, on-created-empty:$browser

# open workspaces 1 & 2 on ext. monitor
workspace = 1, monitor:HDMI-A-1, default:true 
workspace = 2, monitor:HDMI-A-1, 

# workspace = 5, m[1],

# firefox Picture-in-Picture
windowrule = size 32% 18%, match:title ^(Picture-in-Picture)$
windowrule = pin on, match:title ^(Picture-in-Picture)$
windowrule = move monitor_w-window_w monitor_h-window_h, match:title (Picture-in-Picture)
windowrule = float on, match:title ^(Picture-in-Picture)$
# don't focus PiP window when it spawns
windowrule = no_initial_focus on, match:title ^(Picture-in-Picture)$
windowrule = suppress_event activate activatefocus, match:title ^(Picture-in-Picture)$

# hide sensitive windows during screenshare
# bitwarden doesn't work cause it sets title late. new hyprland says title bug only happens for 'static' effects & no_screen_share isn't one of them, but still doesn't work
# dunst doesn't work because class only set on X11?
windowrule = no_screen_share on, match:class ^(Emacs|Dunst|com\.clipse|Bitwarden)$

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
# dwindle {
#     pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
#     preserve_split = true # You probably want this
# }

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = slave
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
    disable_splash_rendering = true
    enable_swallow = true
    # add other programs to regex with | separator
    swallow_regex = ^(com\.mitchellh\.ghostty)$

    # swallow_exception_regex = ^(.*wev.*|.*xkbcli.*|)$
    # swallow_exception_regex = ^(wev.*|swayimg.*)$
    focus_on_activate = true
    on_focus_under_fullscreen = 2
    # exit_window_retains_fullscreen = true

		middle_click_paste = false
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
		# commented out because caps binds are handled by kanat, which is cross-platform
    # kb_options = caps:none # for using caps+WASD as arrow keys on Redragon
    # kb_options = ctrl:nocaps # use caps as ctrl, but issues w/ Caps + WASD on Redragon keeb
    kb_rules =

    follow_mouse = 1

    sensitivity = -0.04 # -1.0 - 1.0, 0 means no modification.
    scroll_button_lock = true
    accel_profile = adaptive
    repeat_delay = 280

    touchpad {
        natural_scroll = true
        scroll_factor = 0.22
        drag_lock = 0 # set to 0 to disable, 1 for remove lock after timeout
    }

    tablet {
        output= current
    }
}

# https://wiki.hypr.land/Configuring/Gestures/
gesture = 3, horizontal, workspace
# gesture = 3, down, mod: ALT, close
gesture = 3, up, fullscreen
gesture = 3, down, scale: 0.5, float

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

binds {
    workspace_back_and_forth = true
}

debug {
    disable_logs = true
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, Q, exec, $terminal
# bind = $mainMod, Escape, exec, $terminal
bind = $mainMod Shift, C, killactive, # close window 
bind = $mainMod Shift, M, exit,     # exit hyprland
bind = $mainMod, F, fullscreen, 1
bind = $mainMod Shift, F, togglefloating,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, B, exec, $browser
bind = $mainMod, Space, exec, $menu

# bind = $mainMod, slash, exec, hyprctl dispatch toggleswallow
bind = $mainMod, slash, toggleswallow, 
# bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, P, pin
# bind = $mainMod, J, togglesplit, # dwindle
# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# simulate alt tab: focus last focused window
bind = $mainMod, Tab, focuscurrentorlast

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10

# move window to monitor
bind = $mainMod SHIFT, A, movewindow, mon:l silent
bind = $mainMod SHIFT, D, movewindow, mon:r silent

# move workspace to monitor (no silent option)
bind = $mainMod, A, movecurrentworkspacetomonitor, l 
bind = $mainMod, D, movecurrentworkspacetomonitor, r 

# DWM style swap master
bind = $mainMod, Return, layoutmsg, swapwithmaster auto

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, setfloating, special:magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e-1
bind = $mainMod, mouse_up, workspace, e+1

# screenshots
bind = , Print, exec, uwsm app -- hyprshot -m region --clipboard-only
bind = SHIFT, Print, exec, uwsm app -- hyprshot -m region -o ~/Pictures/screenshots/
bind = $mainMod, Print, exec, uwsm app -- hyprshot -m window -m active --clipboard-only
bind = $mainMod Shift, Print, exec, uwsm app -- hyprshot -m window -m active -o ~/Pictures/screenshots/
# this prevents black border around screenshots
layerrule = no_anim on, match:namespace hyprpicker
layerrule = no_anim on, match:namespace selection

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Resize windows 
bind = $mainMod Shift, H, resizeactive, -10% 0
bind = $mainMod Shift, L, resizeactive, 10% 0
bind = $mainMod Shift, J, resizeactive, 0 10%
bind = $mainMod Shift, K, resizeactive, 0 -10%

# NOTE: install playerctl, brightnessctl, and wpctl
# Laptop multimedia keys for volume and LCD brightness
# bindel binds are used even whel screen is locked
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 8%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 8%-
bindel = Shift, XF86MonBrightnessUp, exec, brightnessctl s 3%+
bindel = Shift, XF86MonBrightnessDown, exec, brightnessctl s 3%-

# replicate above funcitonality using non-multimedia keys
bindl = $mainMod, equal, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindl = $mainMod, minus, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = $mainMod, backspace, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = $mainMod Shift, equal, exec, brightnessctl s 8%+
bindl = $mainMod Shift, minus, exec, brightnessctl s 8%-
bindl = $mainMod, bracketright, exec, playerctl next
bindl = $mainMod, bracketleft, exec, playerctl previous
bindl = $mainMod, backslash, exec, playerctl play-pause

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous


##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Ignore maximize requests from apps. You'll probably like this.
windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

# Fix some dragging issues with XWayland
windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run
    match:class = hyprland-run
    move = 20 monitor_h-120
    float = yes
}

windowrule = opacity 0.88, match:class com\.mitchellh\.ghostty, 
# windowrule = opacity 0.9, match:class Emacs, 

# clipse clipboard manager
# TODO: need to fix size not being applied
windowrule = float on center on size monitor_w*0.25 monitor_h*0.5, match:class (com.clipse)
windowrule = stay_focused on, match:class (com.clipse)
bind = SUPER, V, exec, ghostty --class=com.clipse -e clipse

windowrule {
	name = clipboard-float-rules
		match:class = (com.clipse)
		float = on 
		center = on 
		size = monitor_w*0.4 monitor_h*0.7 
}

# requires wl-copy, wl-paste, wtype & rofi (or other menu)
bind = $mainMod, period, exec, rofimoji -r '' -a type copy
bind = $mainMod, C, exec, hyprpicker -a
