# Nightlight schedule (t14): warm 4000K from 17:30, neutral from 07:00.
# hyprsunset must be running for these timed profiles to fire -- it is launched
# from ~/.config/hypr/autostart.lua (o.launch_on_start("hyprsunset")).
# 4000K matches what `omarchy toggle nightlight` uses (ON_TEMP); identity means
# no tint at all, so the screen is untouched during the day.

profile {
    time = 17:30
    temperature = 4000
}

profile {
    time = 07:00
    identity = true
}
