# currently using these configs in /etc/systemd/logind.conf for lid & power button
# HandleLidSwitch=loginctl lock-session && suspend 
# HandlePowerKey=loginctl lock-session && suspend 
# HandlePowerKeyLongPress=poweroff

general {
    # disable_loading_bar = false
    # grace = 0
    # no_fade_in = false
}

background {
    monitor =
    # path = $HOME/.config/hypr/img/34.png   # only png supported for now
    color = rgba(20, 20, 20, 0.9)
    blur_size = 4
    blur_passes = 3 # 0 disables blurring
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.64 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgb(15 15 18)
    inner_color =  rgb(200 200 240)
    font_color = rgb(15 15 18)
    fade_on_empty = true
    hide_input = false
    position = 0, 50
    halign = center
    valign = bottom
}

# Current time
label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +"%I:%M %p") </big></b>"
   
    color = rgba(200, 200, 240, 1)

    font_size = 64
    font_family = JetBrains Mono 10
    position = 0, 0
    halign = center
    valign = top
}

# User label
label {
    monitor =
    text = Hey <span text_transform="capitalize" size="larger">$USER</span>
    color = rgb(15 15 18)
    font_size = 20
    font_family = JetBrains Mono 10
    position = 0, 0
    halign = center
    valign = center
}


# Type to unlock
label {
    monitor =
    text = Type to unlock!
    color = rgb(15 15 18)
    font_size = 16
    font_family = JetBrains Mono 10
    position = 0, 30
    halign = center
    valign = bottom
}
