[General]
shown-welcome=true
auto-start=true

[break]
small-every=1800
flash-for=20
confirm-after=20
quick-break=true
big-for=180

[bell]
small-start=qrc:/sounds/chime.mp3
small-end=qrc:/sounds/chime.mp3
start=qrc:/sounds/ding.mp3
end=qrc:/sounds/ding.mp3

[postpone]
max-minute-ratio=63
extend-break-ratio=47

[focus]
small-for=5
